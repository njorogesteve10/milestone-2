<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Click Interaction</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        .icon-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-container i {
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>
<canvas></canvas>
<div id="icon" class="icon-container">
    <i id="playIcon" class="fa-solid fa-play" style="display: none;"></i>
    <i id="pauseIcon" class="fa-solid fa-pause"></i>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/",
        "@lumaai/luma-web": "https://unpkg.com/@lumaai/luma-web@0.2.0/dist/library/luma-web.module.js"
    }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.7.1/dist/gsap.min.js"></script>
<script type="module">
import {
    WebGLRenderer,
    PerspectiveCamera,
    Scene,
    AmbientLight,
    DirectionalLight,
    Vector3,
    Raycaster,
    RingGeometry,
    LineBasicMaterial,
    Line
} from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LumaSplatsThree } from '@lumaai/luma-web';

// Setup canvas, renderer, and camera
let canvas = document.querySelector('canvas');
let renderer = new WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

let scene = new Scene();
let raycaster = new Raycaster();
let mouse = new Vector3();

// Camera setup
let camera = new PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 5);
camera.lookAt(new Vector3(0, 0, 0));

let controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.25;
controls.enableZoom = true;

// Lighting setup
let ambientLight = new AmbientLight(0x404040, 2);
scene.add(ambientLight);

let directionalLight = new DirectionalLight(0xffffff, 1);
directionalLight.position.set(10, 10, 10);
directionalLight.castShadow = true;
scene.add(directionalLight);

// Luma model
let splat = new LumaSplatsThree({
    source: 'https://lumalabs.ai/capture/4e985b9b-5869-4f30-927b-6074ec695ed9'
});
scene.add(splat);

// Fixed Ring (Dotted Orbit Indicator)
let ringMaterial = new LineBasicMaterial({ color: 0x000080, linewidth: 2 }); // Navy blue color
let ringGeometry = new RingGeometry(0.025, 0.0375, 20);  // 1/8th of the original size

let ring = new Line(ringGeometry, ringMaterial);
ring.rotation.x = Math.PI / 2; // Set horizontal alignment
ring.visible = false;  // Initially hidden
scene.add(ring);

// Animation parameters
let angle = 0;
let baseRadius = 3;
let radiusAmplitude = 1;
let baseHeight = 2;
let heightAmplitude = 0.5;
let rotationSpeed = 0.05;

let isPaused = false;

// Variables for concentration effect
let targetPoint = null;
let clickCount = 0;
let threshold = 0.5; // Distance threshold to consider the same point
let movementStep = 0.5; // Camera moves 50% closer each click
let maxClicks = 5; // Maximum clicks to concentrate

// Animation loop
function animate() {
    if (!isPaused) {
        angle += rotationSpeed;

        let radius = baseRadius + Math.sin(angle * 2) * radiusAmplitude;
        let height = baseHeight + Math.sin(angle * 2) * heightAmplitude;

        let x = radius * Math.cos(angle);
        let z = radius * Math.sin(angle);
        camera.position.set(x, height, z);
        camera.lookAt(new Vector3(0, 0, 0));
    }

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

// Start animation
animate();

// Handle window resize
window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});

// Pause and Resume Icons
let pauseIcon = document.getElementById('pauseIcon');
let playIcon = document.getElementById('playIcon');
let iconContainer = document.getElementById('icon');

iconContainer.addEventListener('click', () => {
    isPaused = !isPaused;
    pauseIcon.style.display = isPaused ? 'none' : 'block';
    playIcon.style.display = isPaused ? 'block' : 'none';
});

// Handle click events
canvas.addEventListener('click', (event) => {
    let rect = canvas.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    let intersects = raycaster.intersectObjects(scene.children, true);

    if (intersects.length > 0) {
        let point = intersects[0].point;

        // Adjust the ring's position slightly above the surface to make it visible
        let offsetY = 0.1; // Offset height of the ring
        let adjustedPoint = point.clone();
        adjustedPoint.y += offsetY; // Move ring a bit higher

        // Set the ring's size to a fixed size
        ring.scale.set(1, 1, 1); // Keep ring at the fixed size

        // Check if clicking the same location
        if (targetPoint && point.distanceTo(targetPoint) < threshold) {
            clickCount++;
            if (clickCount <= maxClicks) {
                // Move camera closer to the target
                let direction = new Vector3().subVectors(camera.position, point).normalize();
                let newPosition = new Vector3().copy(camera.position).sub(direction.multiplyScalar(movementStep));

                if (newPosition.distanceTo(point) > 1) { // Minimum distance to stop zooming
                    gsap.to(camera.position, {
                        x: newPosition.x,
                        y: newPosition.y,
                        z: newPosition.z,
                        duration: 1,
                        onUpdate: () => camera.lookAt(point)
                    });
                }
            }
        } else {
            // Set new target point
            targetPoint = point.clone();
            clickCount = 1;
        }

        // Display the ring and set it to the exact point clicked
        ring.position.set(adjustedPoint.x, adjustedPoint.y, adjustedPoint.z);
        ring.visible = true;

        // Hide the ring after the camera moves closer
        setTimeout(() => {
            ring.visible = false;
        }, 1000); // Delay time after camera zooms in

        isPaused = true;
        pauseIcon.style.display = 'none';
        playIcon.style.display = 'block';
    }
});
</script>
</body>
</html>
